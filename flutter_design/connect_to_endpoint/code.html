<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Endpoint Monitor | Connect</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#3c4a5e",
              "on-secondary-container": "#abb9d1",
              "primary": "#98cbff",
              "tertiary-fixed": "#a2eeff",
              "on-primary": "#003354",
              "background": "#0b1326",
              "on-tertiary-container": "#002f36",
              "primary-fixed": "#cfe5ff",
              "on-secondary": "#233144",
              "tertiary-container": "#009fb4",
              "inverse-primary": "#00629d",
              "surface-container-lowest": "#060e20",
              "on-tertiary-fixed-variant": "#004e5a",
              "inverse-surface": "#dae2fd",
              "secondary-fixed-dim": "#b9c7df",
              "error": "#ffb4ab",
              "tertiary": "#2fd9f4",
              "outline-variant": "#414754",
              "secondary": "#b9c7df",
              "surface-container-highest": "#2d3449",
              "surface-container-high": "#222a3d",
              "secondary-fixed": "#d5e3fc",
              "error-container": "#93000a",
              "surface-container": "#171f33",
              "surface": "#0b1326",
              "surface-tint": "#98cbff",
              "on-error": "#690005",
              "on-primary-fixed-variant": "#004a77",
              "on-primary-container": "#002c4a",
              "on-error-container": "#ffdad6",
              "primary-fixed-dim": "#98cbff",
              "on-secondary-fixed-variant": "#3a485b",
              "inverse-on-surface": "#283044",
              "on-surface": "#dae2fd",
              "on-tertiary": "#00363e",
              "surface-bright": "#31394d",
              "tertiary-fixed-dim": "#2fd9f4",
              "surface-dim": "#0b1326",
              "outline": "#8b90a0",
              "on-tertiary-fixed": "#001f25",
              "surface-variant": "#2d3449",
              "on-surface-variant": "#c1c6d7",
              "on-primary-fixed": "#001d33",
              "on-background": "#dae2fd",
              "primary-container": "#0097ec",
              "surface-container-low": "#131b2e",
              "on-secondary-fixed": "#0d1c2e"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      .bg-orchestrator {
        background: radial-gradient(circle at 50% -20%, #171f33 0%, #0b1326 100%);
      }
      .cyber-gradient {
        background: linear-gradient(135deg, #98cbff 0%, #0097ec 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col selection:bg-primary selection:text-on-primary">
<!-- Top Navigation Suppression: Not a top-level destination, but using branding from TopAppBar -->
<header class="flex justify-center items-center w-full px-6 h-24 pt-8">
<div class="flex flex-col items-center gap-2">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary border border-outline-variant/15 shadow-2xl">
<span class="material-symbols-outlined text-3xl" data-icon="monitor_heart">monitor_heart</span>
</div>
<h1 class="font-headline font-extrabold tracking-widest uppercase text-sm text-primary">Endpoint Monitor</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 relative overflow-hidden bg-orchestrator">
<!-- Background Decorative Elements (The Orchestrator Style) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="w-full max-w-md relative z-10">
<!-- Connection Form Card -->
<div class="bg-surface-container-low rounded-xl p-8 shadow-2xl border border-outline-variant/10 backdrop-blur-md">
<div class="mb-8">
<h2 class="font-headline font-bold text-2xl text-on-surface tracking-tight">Establish Connection</h2>
<p class="text-on-surface-variant text-sm mt-1">Initialize telemetry for a remote Windows host.</p>
</div>
<form class="space-y-6">
<!-- Host Input -->
<div class="space-y-2">
<label class="block font-label text-[11px] font-medium tracking-wide text-on-surface-variant uppercase">Remote Host Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant/50">
<span class="material-symbols-outlined text-sm" data-icon="lan">lan</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/15 rounded-lg text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="192.168.1.100" type="text"/>
</div>
</div>
<!-- Token Input -->
<div class="space-y-2">
<label class="block font-label text-[11px] font-medium tracking-wide text-on-surface-variant uppercase">Authentication Token</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant/50">
<span class="material-symbols-outlined text-sm" data-icon="key">key</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-surface-container-lowest border border-outline-variant/15 rounded-lg text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="••••••••••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Connect Button -->
<div class="pt-2">
<button class="cyber-gradient w-full py-4 px-6 rounded-lg text-on-primary font-headline font-bold text-sm tracking-wide uppercase shadow-lg shadow-primary/20 active:scale-95 transition-all duration-150 flex items-center justify-center gap-2" type="submit">
<span>Connect to Endpoint</span>
<span class="material-symbols-outlined text-lg" data-icon="bolt">bolt</span>
</button>
</div>
</form>
<!-- Footer of Card -->
<div class="mt-8 pt-6 border-t border-outline-variant/10">
<div class="flex items-center justify-between mb-4">
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Recent Endpoints</span>
<button class="text-[10px] text-primary font-bold uppercase tracking-widest hover:underline">Clear History</button>
</div>
<div class="flex flex-wrap gap-2">
<!-- Endpoint Chip -->
<button class="flex items-center gap-2 bg-surface-container-high hover:bg-surface-container-highest px-3 py-1.5 rounded-full border border-outline-variant/15 transition-colors group">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary shadow-[0_0_8px_#2fd9f4]"></span>
<span class="font-label text-xs text-on-surface">192.168.1.42</span>
<span class="material-symbols-outlined text-[10px] text-on-surface-variant group-hover:text-primary" data-icon="history">history</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-high hover:bg-surface-container-highest px-3 py-1.5 rounded-full border border-outline-variant/15 transition-colors group opacity-60">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
<span class="font-label text-xs text-on-surface">srv-prod-01</span>
<span class="material-symbols-outlined text-[10px] text-on-surface-variant group-hover:text-primary" data-icon="history">history</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-high hover:bg-surface-container-highest px-3 py-1.5 rounded-full border border-outline-variant/15 transition-colors group opacity-60">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
<span class="font-label text-xs text-on-surface">local-dev-box</span>
<span class="material-symbols-outlined text-[10px] text-on-surface-variant group-hover:text-primary" data-icon="history">history</span>
</button>
</div>
</div>
</div>
<!-- Global Status Meta -->
<div class="mt-8 flex justify-center gap-8 items-center">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Auth Proxy Active</span>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">TLS 1.3 Encryption</span>
</div>
</div>
</div>
</main>
<!-- Support Footer -->
<footer class="p-6 flex flex-col items-center gap-4 bg-background">
<div class="text-[10px] text-on-surface-variant/40 font-medium tracking-[0.2em] uppercase">
            Windows Orchestrator Node v2.4.0-stable
        </div>
<div class="flex gap-6 text-[11px] font-label font-medium text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Documentation</a>
<a class="hover:text-primary transition-colors" href="#">API Keys</a>
<a class="hover:text-primary transition-colors" href="#">Security Audit</a>
</div>
</footer>
<!-- No BottomNavBar on this screen as per "Semantic Shell" mandate (Transactional Flow) -->
</body></html>
