org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Fewer Kotlin daemon / incremental cache failures on Windows (multi-module builds).
kotlin.incremental=false
# Opt out of the new AGP DSL until all Flutter plugins support it.
android.newDsl=false
# Keep legacy KGP for plugins (flutter_foreground_task, share_plus) until they migrate.
android.builtInKotlin=false
